<!DOCTYPE html>

<html>
<head>
<title>My Third JavaScript</title>

<script>


let wins = 0;
let losses = 0;
let ties = 0;

while (true) {
  const playerChoice = prompt("Enter rock, paper, or scissors (or q to quit): ");
  if (playerChoice.toLowerCase() === "q") {
    break;
  }

  if (
    playerChoice !== "rock" &&
    playerChoice !== "paper" &&
    playerChoice !== "scissors"
  ) {
    confirm("Please enter a valid choice.");
    continue;
  }

  const choices = ["rock", "paper", "scissors"];
  const randomIndex = Math.round(Math.random() * 2);
  const computerChoice = choices[randomIndex];

  document.write("The computer chose: ", computerChoice);

  if (computerChoice === playerChoice) {
    confirm("Draw!");
    ties++;
  } else if (
    (playerChoice === "paper" && computerChoice === "rock") ||
    (playerChoice === "rock" && computerChoice === "scissors") ||
    (playerChoice === "scissors" && computerChoice === "paper")
  ) {
    confirm("Won!");
    wins++;
  } else {
    confirm("Lost!");
    losses++;
  }
}

document.write("Wins: ", wins, "Losses:", losses, "Ties:", ties);


    </script>
</head>


  <body>
    


  </body>
</html>
